<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RENDR FARM — Coming Soon</title>

<style>
  [data-theme="dark"] {
    --blue:         #29ABE2;
    --blue-dark:    #1a8abf;
    --blue-glow:    rgba(41,171,226,0.18);
    --bg:           #0d0f14;
    --bg2:          #13161e;
    --surface:      #1a1e28;
    --border:       rgba(41,171,226,0.15);
    --border-soft:  rgba(255,255,255,0.08);
    --txt:          #f0f4f8;
    --txt2:         rgba(240,244,248,0.5);
    --grid-line:    rgba(41,171,226,0.04);
    --glow-color:   rgba(41,171,226,0.12);
    --footer-txt:   rgba(240,244,248,0.2);
    --badge-bg:     rgba(41,171,226,0.1);
    --badge-border: rgba(41,171,226,0.2);
    --badge-txt:    #29ABE2;
    --slot-bg:      #1a1e28;
    --slot-border:  rgba(41,171,226,0.28);
    --modal-bg:     #13161e;
    --input-bg:     #1a1e28;
    --input-border: rgba(255,255,255,0.1);
    --input-ph:     rgba(240,244,248,0.2);
    --toggle-bg:    #1a1e28;
    --toggle-border:rgba(255,255,255,0.12);
    --shadow:       none;
    --cd-shadow:    none;
  }

  [data-theme="light"] {
    --blue:         #29ABE2;
    --blue-dark:    #1a8abf;
    --blue-glow:    rgba(41,171,226,0.18);
    --bg:           #f5f7fa;
    --bg2:          #ffffff;
    --surface:      #eef1f5;
    --border:       rgba(41,171,226,0.2);
    --border-soft:  rgba(0,0,0,0.08);
    --txt:          #111827;
    --txt2:         #6b7280;
    --grid-line:    rgba(41,171,226,0.06);
    --glow-color:   rgba(41,171,226,0.1);
    --footer-txt:   rgba(0,0,0,0.25);
    --badge-bg:     rgba(41,171,226,0.1);
    --badge-border: rgba(41,171,226,0.25);
    --badge-txt:    #1a8abf;
    --slot-bg:      rgba(255,255,255,0.7);
    --slot-border:  rgba(41,171,226,0.3);
    --modal-bg:     #ffffff;
    --input-bg:     #f5f7fa;
    --input-border: rgba(0,0,0,0.1);
    --input-ph:     #bbb;
    --toggle-bg:    #ffffff;
    --toggle-border:rgba(0,0,0,0.1);
    --shadow:       0 2px 12px rgba(0,0,0,0.06);
    --cd-shadow:    0 2px 8px rgba(0,0,0,0.06);
  }

  * { box-sizing:border-box; margin:0; padding:0; }
  html { height:100%; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--txt);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    position: relative;
    overflow-x: hidden;
    transition: background 0.35s, color 0.35s;
  }

  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
    transition: background-image 0.35s;
  }
  body::after {
    content: "";
    position: fixed;
    top: -15%; left: 50%;
    transform: translateX(-50%);
    width: 800px; height: 500px;
    background: radial-gradient(ellipse at center, var(--glow-color) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
    transition: background 0.35s;
  }

  .theme-toggle {
    position: fixed;
    top: 1.2rem; right: 1.4rem;
    z-index: 100;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--toggle-bg);
    border: 1px solid var(--toggle-border);
    box-shadow: var(--shadow);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    transition: background 0.3s, border-color 0.3s, transform 0.2s;
    outline: none;
  }
  .theme-toggle:hover { transform: scale(1.1); border-color: var(--blue); }
  .icon-sun  { display: none; }
  .icon-moon { display: block; }
  [data-theme="light"] .icon-sun  { display: block; }
  [data-theme="light"] .icon-moon { display: none; }

  .page {
    position: relative; z-index: 1;
    width: 100%; max-width: 680px;
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
    gap: 0;
  }

  .logo-wrap { margin-bottom: 3rem; }
  .logo-upload-zone {
    width: 240px; height: 96px;
    border: 1.5px dashed var(--slot-border);
    border-radius: 10px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 6px; cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin: 0 auto;
    position: relative; overflow: hidden;
    background: var(--slot-bg);
  }
  .logo-upload-zone:hover { border-color: var(--blue); background: rgba(41,171,226,0.05); }
  .logo-upload-zone .uz-icon { font-size: 1.5rem; opacity: 0.3; line-height: 1; transition: opacity 0.2s; }
  .logo-upload-zone:hover .uz-icon { opacity: 0.55; }
  .logo-upload-zone .uz-label { font-size: 0.7rem; color: var(--txt2); letter-spacing: 0.06em; text-transform: uppercase; pointer-events: none; }
  .logo-upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .logo-preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 10px; display: none; }
  .logo-upload-zone.has-logo .uz-icon,
  .logo-upload-zone.has-logo .uz-label { display: none; }
  .logo-upload-zone.has-logo { border-style: solid; border-color: var(--border); }

  .cs-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--badge-bg);
    border: 1px solid var(--badge-border);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 0.72rem; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--badge-txt);
    margin-bottom: 1.8rem;
    transition: background 0.35s, color 0.35s;
  }
  .cs-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--blue);
    animation: blink 1.8s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.25;} }

  .img-slot {
    width: 100%; border-radius: 14px; overflow: hidden;
    border: 1.5px dashed var(--slot-border);
    background: var(--slot-bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; cursor: pointer; position: relative;
    transition: border-color 0.2s, background 0.35s;
    margin-bottom: 2.5rem;
  }
  .img-slot:hover { border-color: var(--blue); background: rgba(41,171,226,0.03); }
  .img-slot .is-icon { font-size: 1.8rem; opacity: 0.18; line-height: 1; transition: opacity 0.2s; }
  .img-slot:hover .is-icon { opacity: 0.4; }
  .img-slot .is-label { font-size: 0.7rem; color: var(--txt2); letter-spacing: 0.06em; text-transform: uppercase; pointer-events: none; }
  .img-slot input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .img-slot img.is-preview { width: 100%; height: 100%; object-fit: cover; display: none; }
  .img-slot.has-img { border-style: solid; border-color: var(--border); }
  .img-slot.has-img .is-icon,
  .img-slot.has-img .is-label { display: none; }
  .img-slot.has-img img.is-preview { display: block; }
  .img-slot .is-remove {
    position: absolute; top: 10px; right: 10px;
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(0,0,0,0.45); color: #fff;
    border: none; font-size: 0.75rem; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    z-index: 2; line-height: 1; transition: background 0.2s;
  }
  .img-slot .is-remove:hover { background: rgba(0,0,0,0.75); }
  .img-slot.has-img .is-remove { display: flex; }
  #img-slot-1 { height: 340px; }
  #img-slot-2 { height: 240px; }

  h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(3rem, 9vw, 5.5rem);
    font-weight: 700; line-height: 0.98;
    letter-spacing: -0.01em;
    color: var(--txt);
    margin-bottom: 1.2rem;
    transition: color 0.35s;
  }
  h1 em { color: var(--blue); font-style: normal; }

  .tagline {
    font-size: 0.9rem; font-style: italic;
    color: var(--blue-dark);
    margin-bottom: 0.8rem; letter-spacing: 0.02em;
  }
  [data-theme="dark"] .tagline { color: var(--blue); }

  .sub {
    font-size: 1rem; color: var(--txt2);
    line-height: 1.75; max-width: 480px;
    margin: 0 auto 2.8rem;
    transition: color 0.35s;
  }

  .countdown {
    display: flex; gap: 1.5rem;
    justify-content: center;
    margin-bottom: 3rem; flex-wrap: wrap;
  }
  .cd-unit { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .cd-num {
    font-family: 'Rajdhani', sans-serif;
    font-size: 2.8rem; font-weight: 700;
    color: var(--txt);
    background: var(--surface);
    border: 1px solid var(--border-soft);
    box-shadow: var(--cd-shadow);
    border-radius: 10px;
    width: 80px; height: 72px;
    display: flex; align-items: center; justify-content: center;
    letter-spacing: 0.04em;
    transition: background 0.35s, color 0.35s, border-color 0.35s;
  }
  .cd-lbl { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--txt2); transition: color 0.35s; }
  .cd-sep { font-family: 'Rajdhani', sans-serif; font-size: 2.2rem; font-weight: 700; color: var(--blue); align-self: center; padding-bottom: 1.2rem; opacity: 0.5; }

  .notify-btn {
    background: var(--blue); color: #fff;
    border: none; border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 1rem; font-weight: 600;
    padding: 15px 36px; cursor: pointer;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    letter-spacing: 0.02em; margin-bottom: 3rem;
    box-shadow: 0 4px 18px rgba(41,171,226,0.25);
  }
  .notify-btn:hover { background: var(--blue-dark); transform: translateY(-2px); box-shadow: 0 8px 28px var(--blue-glow); }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--modal-bg);
    border: 1px solid var(--border-soft);
    box-shadow: 0 16px 48px rgba(0,0,0,0.2);
    border-radius: 16px;
    padding: 2.5rem 2rem;
    width: 100%; max-width: 440px;
    position: relative;
    transform: translateY(16px);
    transition: transform 0.25s, background 0.35s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-close { position: absolute; top: 16px; right: 18px; background: none; border: none; color: var(--txt2); font-size: 1.3rem; cursor: pointer; line-height: 1; transition: color 0.2s; }
  .modal-close:hover { color: var(--txt); }
  .modal h2 { font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; font-weight: 700; color: var(--txt); margin-bottom: 0.4rem; transition: color 0.35s; }
  .modal p { font-size: 0.88rem; color: var(--txt2); margin-bottom: 1.6rem; line-height: 1.6; transition: color 0.35s; }
  .modal .form-group { margin-bottom: 1rem; }
  .modal label { display: block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--txt2); margin-bottom: 6px; }
  .modal input {
    width: 100%; padding: 11px 14px;
    background: var(--input-bg);
    border: 1.5px solid var(--input-border);
    border-radius: 8px;
    font-size: 0.9rem; font-family: 'Inter', sans-serif;
    color: var(--txt); outline: none;
    transition: border-color 0.2s, background 0.35s, color 0.35s;
  }
  .modal input::placeholder { color: var(--input-ph); }
  .modal input:focus { border-color: var(--blue); }
  .modal .submit-btn { width: 100%; padding: 13px; background: var(--blue); color: #fff; border: none; border-radius: 8px; font-size: 0.92rem; font-weight: 700; cursor: pointer; margin-top: 0.5rem; transition: background 0.2s; font-family: 'Inter', sans-serif; }
  .modal .submit-btn:hover { background: var(--blue-dark); }
  .modal-success { text-align: center; padding: 1rem 0; display: none; }
  .modal-success .check { font-size: 2.5rem; margin-bottom: 0.8rem; }
  .modal-success h3 { font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; color: var(--blue); margin-bottom: 0.4rem; }
  .modal-success p { font-size: 0.85rem; color: var(--txt2); margin: 0; }

  .social-strip { display: flex; gap: 1.5rem; justify-content: center; margin-bottom: 2.5rem; }
  .soc-link { color: var(--txt2); text-decoration: none; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; transition: color 0.2s; display: flex; align-items: center; gap: 6px; }
  .soc-link::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); opacity: 0.5; transition: opacity 0.2s; }
  .soc-link:hover { color: var(--blue); }
  .soc-link:hover::before { opacity: 1; }

  .footer-line { font-size: 0.72rem; color: var(--footer-txt); margin-top: 1rem; transition: color 0.35s; }

  @keyframes fadeUp { from{opacity:0;transform:translateY(18px);} to{opacity:1;transform:translateY(0);} }
  .page > * { animation: fadeUp 0.55s ease both; }
  .page > *:nth-child(1)  { animation-delay: 0.00s; }
  .page > *:nth-child(2)  { animation-delay: 0.08s; }
  .page > *:nth-child(3)  { animation-delay: 0.16s; }
  .page > *:nth-child(4)  { animation-delay: 0.22s; }
  .page > *:nth-child(5)  { animation-delay: 0.28s; }
  .page > *:nth-child(6)  { animation-delay: 0.34s; }
  .page > *:nth-child(7)  { animation-delay: 0.40s; }
  .page > *:nth-child(8)  { animation-delay: 0.46s; }
  .page > *:nth-child(9)  { animation-delay: 0.52s; }
  .page > *:nth-child(10) { animation-delay: 0.58s; }

  @media(max-width:500px) {
    .cd-num { width:64px; height:58px; font-size:2.2rem; }
    .countdown { gap:0.75rem; }
    .cd-sep { font-size:1.6rem; }
    #img-slot-1 { height: 220px; }
    #img-slot-2 { height: 180px; }
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

<script>
const SITE = {
  headline: ["Print What's", "Possible."],
  tagline:  "Where Prints Take Root.",
  subline:  "High-quality 3D printing for creators, brands, and businesses — powered by a fleet built for precision. We're putting the finishing touches on the farm.",
  launchDate: "2025-09-01",
  notifyLabel:  "Subscribe for Updates",
  modalHeading: "Stay in the Loop",
  modalSubline: "Leave your name and email and we'll notify you the moment RENDR FARM opens its doors.",
  formEndpoint: "https://formspree.io/f/xgopywqv",
  socials: [
    { label: "Instagram", url: "https://instagram.com/rendrhobby" },
    { label: "Facebook",  url: "https://facebook.com/rendrhobby" },
    { label: "TikTok",    url: "" },
  ],
  copyright: "© 2026 RENDR FARM. All rights reserved.",
};
</script>

<button class="theme-toggle" onclick="toggleTheme()" title="Toggle light / dark mode">
  <span class="icon-moon">🌙</span>
  <span class="icon-sun">☀️</span>
</button>

<div class="page">

  <div class="logo-wrap">
    <div class="logo-upload-zone" id="logo-zone">
      <span class="uz-icon">&#128444;</span>
      <span class="uz-label">Click to upload logo</span>
      <input type="file" accept="image/*" onchange="swapLogo(this)" />
      <img class="logo-preview" id="logo-preview" alt="RENDR FARM" />
    </div>
  </div>

  <div class="cs-badge">
    <span class="cs-dot"></span>
    Coming Soon
  </div>

  <div class="img-slot" id="img-slot-1">
    <span class="is-icon">&#9634;</span>
    <span class="is-label">Click to add image</span>
    <input type="file" accept="image/*" onchange="loadSlot('img-slot-1','prev-1',this)" />
    <img class="is-preview" id="prev-1" alt="" />
    <button class="is-remove" onclick="clearSlot('img-slot-1','prev-1',event)">&#10005;</button>
  </div>

  <h1 id="headline"></h1>
  <div class="tagline" id="tagline"></div>
  <p class="sub" id="subline"></p>

  <div class="countdown" id="countdown"></div>

  <div class="img-slot" id="img-slot-2">
    <span class="is-icon">&#9634;</span>
    <span class="is-label">Click to add image</span>
    <input type="file" accept="image/*" onchange="loadSlot('img-slot-2','prev-2',this)" />
    <img class="is-preview" id="prev-2" alt="" />
    <button class="is-remove" onclick="clearSlot('img-slot-2','prev-2',event)">&#10005;</button>
  </div>

  <button class="notify-btn" onclick="openModal()" id="notify-btn"></button>
  <div class="social-strip" id="socials"></div>
  <div class="footer-line" id="footer-copy"></div>

</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeOnBg(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
    <div id="modal-form-wrap">
      <h2 id="modal-heading"></h2>
      <p id="modal-subline"></p>
      <form id="notify-form">
        <div class="form-group">
          <label>Your Name *</label>
          <input type="text" name="name" placeholder="Jane Smith" required />
        </div>
        <div class="form-group">
          <label>Email Address *</label>
          <input type="email" name="email" placeholder="jane@example.com" required />
        </div>
        <button type="submit" class="submit-btn" id="modal-submit"></button>
      </form>
    </div>
    <div class="modal-success" id="modal-success">
      <div class="check">&#10003;</div>
      <h3>You're on the list!</h3>
      <p>We'll email you the moment RENDR FARM opens.<br>Stay tuned.</p>
    </div>
  </div>
</div>

<script>
document.getElementById('headline').innerHTML = SITE.headline[0] + '<br><em>' + SITE.headline[1] + '</em>';
document.getElementById('tagline').textContent       = SITE.tagline;
document.getElementById('subline').textContent       = SITE.subline;
document.getElementById('notify-btn').textContent    = SITE.notifyLabel;
document.getElementById('modal-heading').textContent = SITE.modalHeading;
document.getElementById('modal-subline').textContent = SITE.modalSubline;
document.getElementById('modal-submit').textContent  = SITE.notifyLabel;
document.getElementById('footer-copy').textContent   = SITE.copyright;

function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  try { localStorage.setItem('rf-theme', next); } catch(e) {}
}
try {
  const saved = localStorage.getItem('rf-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
} catch(e) {}

function swapLogo(input) {
  const file = input.files[0];
  if (!file) return;
  const prev = document.getElementById('logo-preview');
  prev.src = URL.createObjectURL(file);
  prev.style.display = 'block';
  document.getElementById('logo-zone').classList.add('has-logo');
}

function loadSlot(slotId, prevId, input) {
  const file = input.files[0];
  if (!file) return;
  document.getElementById(prevId).src = URL.createObjectURL(file);
  document.getElementById(slotId).classList.add('has-img');
}
function clearSlot(slotId, prevId, e) {
  e.stopPropagation();
  const slot = document.getElementById(slotId);
  document.getElementById(prevId).src = '';
  slot.classList.remove('has-img');
  slot.querySelector('input[type=file]').value = '';
}

const socWrap = document.getElementById('socials');
SITE.socials.filter(s => s.url).forEach(s => {
  const a = document.createElement('a');
  a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
  a.className = 'soc-link'; a.textContent = s.label;
  socWrap.appendChild(a);
});
if (!socWrap.children.length) socWrap.style.display = 'none';

(function() {
  const wrap = document.getElementById('countdown');
  if (!SITE.launchDate) { wrap.style.display = 'none'; return; }
  const target = new Date(SITE.launchDate).getTime();
  function pad(n) { return String(Math.max(0,n)).padStart(2,'0'); }
  function render() {
    const diff = target - Date.now();
    if (diff <= 0) { wrap.style.display = 'none'; return; }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    if (!wrap.children.length) {
      wrap.innerHTML = `
        <div class="cd-unit"><div class="cd-num" id="cd-d">${pad(d)}</div><div class="cd-lbl">Days</div></div>
        <div class="cd-sep">:</div>
        <div class="cd-unit"><div class="cd-num" id="cd-h">${pad(h)}</div><div class="cd-lbl">Hours</div></div>
        <div class="cd-sep">:</div>
        <div class="cd-unit"><div class="cd-num" id="cd-m">${pad(m)}</div><div class="cd-lbl">Minutes</div></div>
        <div class="cd-sep">:</div>
        <div class="cd-unit"><div class="cd-num" id="cd-s">${pad(s)}</div><div class="cd-lbl">Seconds</div></div>`;
    } else {
      document.getElementById('cd-d').textContent = pad(d);
      document.getElementById('cd-h').textContent = pad(h);
      document.getElementById('cd-m').textContent = pad(m);
      document.getElementById('cd-s').textContent = pad(s);
    }
  }
  render();
  setInterval(render, 1000);
})();

function openModal() {
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
function closeOnBg(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

document.getElementById('notify-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('modal-submit');
  btn.textContent = 'Sending…'; btn.disabled = true;
  try {
    const r = await fetch(SITE.formEndpoint, {
      method: 'POST', body: new FormData(this),
      headers: { Accept: 'application/json' }
    });
    if (r.ok) {
      document.getElementById('modal-form-wrap').style.display = 'none';
      document.getElementById('modal-success').style.display = 'block';
    } else { btn.textContent = 'Try again'; btn.disabled = false; }
  } catch { btn.textContent = SITE.notifyLabel; btn.disabled = false; }
});
</script>

</body>
</html>
